<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Мои домики</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F3F5F1; --card:#FFFFFF; --ink:#17231C; --muted:#56635A; --accent:#1F5A41; --accent-dark:#143D2C;
  --soft:#E3EDE6; --line:#E0E6E1; --warn:#852A20;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:'Manrope',system-ui,-apple-system,sans-serif;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit}
#app{max-width:520px;margin:0 auto;min-height:100vh;padding-bottom:calc(86px + env(safe-area-inset-bottom))}
main{padding:20px 16px 24px;display:flex;flex-direction:column;gap:16px}
nav#tabs{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr);padding:4px 0 calc(6px + env(safe-area-inset-bottom));z-index:5}
nav#tabs button{background:none;border:0;font-size:11px;font-weight:600;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 0;min-height:54px;cursor:pointer}
nav#tabs button.on{color:var(--accent);font-weight:800}
.head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.sub{font-size:13px;font-weight:600;color:var(--muted)}
h1{margin:2px 0 0;font-size:28px;font-weight:800;letter-spacing:-.02em}
h2{margin:4px 0 0;font-size:17px;font-weight:700}
.iconbtn{width:44px;height:44px;border-radius:12px;border:0;background:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer;flex:none}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{background:#fff;border-radius:16px;padding:14px 16px}
.tile b{display:block;font-size:24px;font-weight:800}
.tile span{font-size:13px;color:var(--muted)}
.tile.accent{grid-column:1/3;background:var(--accent);color:#fff;display:flex;justify-content:space-between;align-items:center;border:0;text-align:left;cursor:pointer;width:100%}
.tile.accent span{color:#CFE3D7}
.list{display:flex;flex-direction:column;gap:8px}
.row{background:#fff;border-radius:16px;padding:12px 14px;display:flex;align-items:center;gap:12px;border:0;text-align:left;width:100%;cursor:pointer}
.num{width:40px;height:40px;border-radius:12px;background:var(--soft);color:var(--accent);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:15px;flex:none}
.grow{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.t{font-size:15px;font-weight:700}
.s{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chip{font-size:12px;font-weight:700;padding:5px 10px;border-radius:999px;white-space:nowrap;flex:none}
.c-busy{background:#F1E4CF;color:#6E4210}.c-free{background:#DCEDE2;color:#1A5038}.c-in{background:#DCE6F4;color:#1E4A85}.c-out{background:#F4DEDA;color:#852A20}
.btn{height:52px;border:0;border-radius:16px;background:var(--accent);color:#fff;font-size:16px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:8px;width:100%;cursor:pointer;text-decoration:none}
.btn:active{background:var(--accent-dark)}
.btn.ghost{background:#fff;color:var(--ink);border:1.5px solid #CBD6CE;height:48px;font-size:15px}
.btn.danger{background:#fff;color:var(--warn);border:1.5px solid #E7C3BD;height:48px;font-size:15px}
.btn.small{height:40px;font-size:14px;border-radius:12px;width:auto;padding:0 14px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.card{background:#fff;border-radius:20px;padding:16px;display:flex;flex-direction:column;gap:12px}
.empty{background:#fff;border-radius:16px;padding:18px;text-align:center;color:var(--muted);font-size:14px;line-height:1.45}
.kv{background:var(--bg);border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;gap:2px}
.kv span{font-size:12px;color:var(--muted)}.kv b{font-size:15px}
.note{font-size:14px;color:#3C4A41;background:#F6F0E4;border-radius:12px;padding:10px 12px;white-space:pre-wrap}
.progress{height:10px;border-radius:999px;background:var(--soft);overflow:hidden}
.progress div{height:100%;background:var(--accent)}
.pay{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid #E8ECE8}
.pay:last-child{border-bottom:0}
.x{width:32px;height:32px;border:0;border-radius:8px;background:var(--bg);color:var(--muted);cursor:pointer;flex:none}
/* calendar */
.calnav{display:flex;align-items:center;gap:8px}
.cal{background:#fff;border-radius:16px;padding:10px 6px 4px;overflow:hidden}
.crow{display:grid;grid-template-columns:58px repeat(7,minmax(0,1fr));align-items:center}
.chead{text-align:center;padding-bottom:6px;border-bottom:1px solid var(--line)}
.chead .d{font-size:11px;color:var(--muted);font-weight:600}
.chead .n{font-size:14px;font-weight:700;width:28px;height:28px;margin:2px auto 0;display:flex;align-items:center;justify-content:center;border-radius:50%}
.chead .today .n{background:var(--accent);color:#fff}
.chead .we .d{color:#852A20}
.cline{grid-template-rows:52px;border-bottom:1px solid #EEF1EE}
.cline:last-child{border-bottom:0}
.cname{grid-column:1;grid-row:1;font-size:12px;font-weight:700;padding-left:4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cell{grid-row:1;height:100%;border:0;background:transparent;cursor:pointer;padding:0;border-left:1px solid #F1F3F1}
.cell:active{background:var(--soft)}
.bar{grid-row:1;height:34px;margin:0 2px;border-radius:8px;border:0;background:var(--accent);color:#fff;font-size:12px;font-weight:700;padding:0 6px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;cursor:pointer;text-align:left;position:relative;z-index:1}
.bar.debt{background:#E3EDE6;color:#1A5038;border:1.5px dashed var(--accent)}
.bar.cl{border-top-left-radius:0;border-bottom-left-radius:0;margin-left:0}
.bar.cr{border-top-right-radius:0;border-bottom-right-radius:0;margin-right:0}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--muted);padding:0 4px}
.legend i{display:inline-block;width:14px;height:14px;border-radius:4px;vertical-align:-2px;margin-right:6px}
/* money */
.hbar{display:grid;grid-template-columns:76px minmax(0,1fr) 92px;gap:10px;align-items:center;font-size:13px}
.hbar .track{height:14px;border-radius:4px;background:var(--soft);overflow:hidden}
.hbar .track div{height:100%;background:var(--accent);border-radius:4px}
.split{height:8px;border-radius:999px;background:var(--soft);display:flex;overflow:hidden}
/* forms */
.field{display:flex;flex-direction:column;gap:6px}
.field>label{font-size:13px;font-weight:600;color:var(--muted)}
input,select,textarea{font:inherit;font-size:16px;color:var(--ink);background:#fff;border:1.5px solid #D7DFD9;border-radius:12px;padding:11px 12px;width:100%;outline:none;-webkit-appearance:none;appearance:none}
input:focus,select:focus,textarea:focus{border-color:var(--accent)}
textarea{min-height:72px;resize:vertical}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{border:1.5px solid #D7DFD9;background:#fff;border-radius:999px;padding:8px 14px;font-size:14px;font-weight:600;cursor:pointer;min-height:40px}
.seg button.on{background:var(--accent);border-color:var(--accent);color:#fff}
.err{background:#F4DEDA;color:#852A20;border-radius:12px;padding:10px 12px;font-size:14px;font-weight:600}
.hint{font-size:13px;color:var(--muted)}
.search{background:#fff}
/* sheet */
#sheet{position:fixed;inset:0;z-index:20}
#sheet[hidden]{display:none}
#sheet .backdrop{position:absolute;inset:0;background:rgba(15,25,20,.45)}
#sheet .panel{position:absolute;left:0;right:0;bottom:0;max-width:520px;margin:0 auto;max-height:92vh;overflow-y:auto;background:var(--bg);border-radius:24px 24px 0 0;padding:8px 16px calc(24px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:14px;animation:up .22s ease}
@keyframes up{from{transform:translateY(40px);opacity:.4}to{transform:none;opacity:1}}
.grab{width:40px;height:5px;border-radius:3px;background:#C9D2CB;margin:4px auto 0;flex:none}
.shead{display:flex;align-items:center;justify-content:space-between;gap:10px}
#toast{position:fixed;left:50%;bottom:110px;transform:translateX(-50%);background:#17231C;color:#fff;padding:10px 16px;border-radius:12px;font-size:14px;font-weight:600;opacity:0;pointer-events:none;transition:opacity .2s;z-index:40;max-width:90vw;text-align:center}
#toast.show{opacity:1}
.fline{display:flex;justify-content:space-between;gap:10px;font-size:15px;padding:7px 0;border-bottom:1px solid #EEF1EE}
.fline span{color:var(--muted)}
.fline.strong{font-size:18px;border-bottom:0;padding-top:10px}.fline.strong span{color:var(--ink);font-weight:700}.fline.strong b{color:var(--accent)}
.seg.mv{background:#E3E8E4;border-radius:12px;padding:3px;gap:3px;flex-wrap:nowrap}
.seg.mv button{flex:1;border:0;background:transparent;border-radius:10px}
.seg.mv button.on{background:#fff;color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.mrow{display:grid;grid-template-columns:40px minmax(0,1fr) 100px;gap:10px;align-items:center;background:none;border:0;padding:2px 0;text-align:left;cursor:pointer;font-size:14px}
.mrow .track{height:14px;border-radius:4px;background:var(--soft);overflow:hidden;display:block}
.mrow .track span{display:block;height:100%;background:var(--accent);border-radius:4px}
.mrow b{text-align:right}
.banner{border-radius:12px;padding:10px 12px;font-size:14px;line-height:1.4}
.banner.bad{background:#F4DEDA;color:#6E1F17}.banner.good{background:#DCEDE2;color:#14402C}
.tiles .tile b{font-size:22px}
/* quick input + tasks */
.quick{gap:10px}
.qline{display:flex;gap:8px;align-items:stretch}
.qline textarea{min-height:48px;height:48px;resize:none;padding:12px}
.qline .iconbtn{background:var(--accent);color:#fff;height:48px;width:48px}
.qline .iconbtn.rec{background:#852A20}
.qres{background:var(--bg);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:8px}
.qres .kvline{display:flex;justify-content:space-between;gap:10px;font-size:14px}
.qres .kvline span{color:var(--muted)}
.qres .miss{color:#852A20;font-weight:600}
.task{background:#fff;border-radius:14px;padding:10px 12px;display:flex;align-items:center;gap:10px}
.chk{width:30px;height:30px;border-radius:9px;border:2px solid #9DB0A3;background:#fff;flex:none;cursor:pointer;display:flex;align-items:center;justify-content:center;color:#fff;padding:0}
.chk.on{background:var(--accent);border-color:var(--accent)}
.task.done .t{text-decoration:line-through;color:var(--muted);font-weight:600}
.imp{background:#F4DEDA;color:#852A20}
.seg.scroll{flex-wrap:nowrap;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.seg.scroll::-webkit-scrollbar{display:none}
.seg.scroll button{flex:none}
.linkbtn{background:none;border:0;color:var(--accent);font-weight:700;font-size:14px;cursor:pointer;padding:8px 0;text-align:left}
</style>
</head>
<body>
<div id="app">
  <main id="view"></main>
  <nav id="tabs">
    <button data-act="tab" data-tab="today"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V21h14V9.5"/></svg>Сегодня</button>
    <button data-act="tab" data-tab="cal"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>Календарь</button>
    <button data-act="tab" data-tab="tasks"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="3" width="16" height="18" rx="2"/><path d="M8 8l1.5 1.5L12 7M8 14l1.5 1.5L12 13M14.5 8.5H17M14.5 14.5H17"/></svg>Дела</button>
    <button data-act="tab" data-tab="guests"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="9" cy="8" r="4"/><path d="M2 21c0-4 3-6 7-6s7 2 7 6"/><path d="M16 4a4 4 0 0 1 0 8M22 21c0-3-2-5-4-5.5"/></svg>Гости</button>
    <button data-act="tab" data-tab="money"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2" y="6" width="20" height="14" rx="2"/><path d="M2 10h20M16 15h2"/></svg>Деньги</button>
  </nav>
</div>
<div id="sheet" hidden><div class="backdrop" data-act="close"></div><div class="panel" id="panel"></div></div>
<div id="toast"></div>

<script>
/* ===== Telegram ===== */
const tg = window.Telegram && window.Telegram.WebApp;
const ver = v => !!(tg && tg.isVersionAtLeast && tg.isVersionAtLeast(v));
if (tg) { tg.ready(); tg.expand(); try { tg.setHeaderColor('#F3F5F1'); tg.setBackgroundColor('#F3F5F1'); } catch (e) {} }
const cloudOK = !!(tg && tg.initData && tg.CloudStorage && ver('6.9'));
const haptic = t => { try { tg.HapticFeedback.notificationOccurred(t || 'success'); } catch (e) {} };
const SR = window.SpeechRecognition || window.webkitSpeechRecognition || null;

/* ===== Data ===== */
const LS = 'domiki_v1';
let cfg = { cabins: [1, 2, 3, 4].map(i => ({ id: i, name: 'Домик ' + i, price: 0 })) };
let bookings = [];
let tasks = [];
let expenses = [];
let gnotes = [];
const ITEMS = { expenses: 'x_', gnotes: 'g_' };
const itemList = kind => kind === 'expenses' ? expenses : gnotes;
function setItems(kind, list) { if (kind === 'expenses') expenses = list; else gnotes = list; }
let ui = { mview: 'month', fdays: 30, tab: 'today', calStart: null, month: null, q: '', tf: 'all', showDone: false, parsed: null, qtext: '' };

const cs = {
  keys: () => new Promise((res, rej) => tg.CloudStorage.getKeys((e, k) => e ? rej(e) : res(k || []))),
  get: ks => new Promise((res, rej) => tg.CloudStorage.getItems(ks, (e, v) => e ? rej(e) : res(v || {}))),
  set: (k, v) => new Promise((res, rej) => tg.CloudStorage.setItem(k, v, (e, ok) => e ? rej(e) : res(ok))),
  del: k => new Promise((res, rej) => tg.CloudStorage.removeItem(k, (e, ok) => e ? rej(e) : res(ok)))
};
function backup() { try { localStorage.setItem(LS, JSON.stringify({ cfg, bookings, tasks, expenses, gnotes })); } catch (e) {} }
async function load() {
  try { const raw = JSON.parse(localStorage.getItem(LS) || 'null'); if (raw) { cfg = raw.cfg || cfg; bookings = raw.bookings || []; tasks = raw.tasks || []; expenses = raw.expenses || []; gnotes = raw.gnotes || []; } } catch (e) {}
  if (cloudOK) {
    try {
      const keys = await cs.keys();
      if (keys.length) {
        const vals = {};
        for (let i = 0; i < keys.length; i += 50) Object.assign(vals, await cs.get(keys.slice(i, i + 50)));
        if (vals.cfg) cfg = JSON.parse(vals.cfg);
        bookings = keys.filter(k => k.startsWith('b_')).map(k => { try { return JSON.parse(vals[k]); } catch (e) { return null; } }).filter(Boolean);
        tasks = keys.filter(k => k.startsWith('t_')).map(k => { try { return JSON.parse(vals[k]); } catch (e) { return null; } }).filter(Boolean);
        Object.keys(ITEMS).forEach(kind => setItems(kind, keys.filter(k => k.startsWith(ITEMS[kind])).map(k => { try { return JSON.parse(vals[k]); } catch (e) { return null; } }).filter(Boolean)));
      } else if (bookings.length) {
        await cs.set('cfg', JSON.stringify(cfg));
        for (const b of bookings) await cs.set('b_' + b.id, JSON.stringify(b));
      }
    } catch (e) { toast('Не получилось загрузить данные из Telegram'); }
  }
  if (serverOK) {
    await flush();
    const r = await call({ action: 'load' });
    if (r && r.ok) {
      const rt = r.tasks || [], rx = r.expenses || [], rg = r.gnotes || [];
      if (!r.bookings.length && !rt.length && !rx.length && (bookings.length || tasks.length || expenses.length)) await call({ action: 'import', cfg, bookings, tasks, expenses, gnotes });
      else { bookings = r.bookings; tasks = rt; expenses = rx; gnotes = rg; if (r.cfg) cfg = r.cfg; else await call({ action: 'cfg', cfg }); }
      synced = true;
    } else if (r && r.error === 'forbidden') toast('У вас нет доступа к этим данным');
    else if (r && r.error === 'auth') toast('Закройте и откройте приложение заново');
    else toast('Нет связи — показываю сохранённое на телефоне');
  }
  backup();
}

/* ===== Server (Google) sync ===== */
const QS = new URLSearchParams(location.search);
let API_URL = QS.get('api') || '';
try { if (API_URL) localStorage.setItem('domiki_api', API_URL); else API_URL = localStorage.getItem('domiki_api') || ''; } catch (e) {}
const OPEN_B = QS.get('b') || '';
const serverOK = !!(API_URL && tg && tg.initData);
let synced = false, flushing = false;
const getQ = () => { try { return JSON.parse(localStorage.getItem('domiki_q') || '[]'); } catch (e) { return []; } };
const setQ = q => { try { localStorage.setItem('domiki_q', JSON.stringify(q)); } catch (e) {} };
async function call(body) {
  try {
    const r = await fetch(API_URL, { method: 'POST', body: JSON.stringify({ ...body, initData: tg.initData }) });
    return await r.json();
  } catch (e) { return null; }
}
async function flush() {
  if (!serverOK || flushing) return;
  flushing = true;
  try {
    let q = getQ();
    while (q.length) {
      const r = await call(q[0]);
      if (!r) { toast('Нет связи — сохранено на телефоне, отправлю позже'); break; }
      q = getQ(); q.shift(); setQ(q);
    }
  } finally { flushing = false; }
}
function enqueue(op) { if (!serverOK) return; const q = getQ(); q.push(op); setQ(q); flush(); }

async function saveBooking(b) {
  const i = bookings.findIndex(x => x.id === b.id);
  if (i >= 0) bookings[i] = b; else bookings.push(b);
  backup();
  enqueue({ action: 'save', booking: b });
  if (cloudOK) { try { await cs.set('b_' + b.id, JSON.stringify(b)); } catch (e) { if (!serverOK) toast('Сохранено только на этом телефоне'); } }
}
async function removeBooking(id) {
  bookings = bookings.filter(b => b.id !== id); backup();
  enqueue({ action: 'delete', id });
  if (cloudOK) { try { await cs.del('b_' + id); } catch (e) {} }
}
async function saveTask(t) {
  const i = tasks.findIndex(x => x.id === t.id);
  if (i >= 0) tasks[i] = t; else tasks.push(t);
  backup();
  enqueue({ action: 'saveTask', task: t });
  if (cloudOK) { try { await cs.set('t_' + t.id, JSON.stringify(t)); } catch (e) {} }
}
async function removeTask(id) {
  tasks = tasks.filter(t => t.id !== id); backup();
  enqueue({ action: 'deleteTask', id });
  if (cloudOK) { try { await cs.del('t_' + id); } catch (e) {} }
}
async function saveItem(kind, item) {
  const list = itemList(kind), i = list.findIndex(x => x.id === item.id);
  if (i >= 0) list[i] = item; else list.push(item);
  backup();
  enqueue({ action: 'saveItem', kind, item });
  if (cloudOK) { try { await cs.set(ITEMS[kind] + item.id, JSON.stringify(item)); } catch (e) {} }
}
async function removeItem(kind, id) {
  setItems(kind, itemList(kind).filter(x => x.id !== id)); backup();
  enqueue({ action: 'deleteItem', kind, id });
  if (cloudOK) { try { await cs.del(ITEMS[kind] + id); } catch (e) {} }
}
async function saveCfg() { backup(); enqueue({ action: 'cfg', cfg }); if (cloudOK) { try { await cs.set('cfg', JSON.stringify(cfg)); } catch (e) {} } }
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 6);

/* ===== Helpers ===== */
const pad = n => String(n).padStart(2, '0');
const ds = d => d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
const parse = s => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
const today = () => ds(new Date());
const addDays = (s, n) => { const d = parse(s); d.setDate(d.getDate() + n); return ds(d); };
const diff = (a, b) => Math.round((parse(b) - parse(a)) / 864e5);
const MON = ['янв','фев','мар','апр','мая','июн','июл','авг','сен','окт','ноя','дек'];
const MONG = ['января','февраля','марта','апреля','мая','июня','июля','августа','сентября','октября','ноября','декабря'];

/* ===== Status ===== */
function cabinStatus(c, t) {
  const bs = bookings.filter(b => b.cabin == c.id);
  const inB = bs.find(b => b.inDate === t), outB = bs.find(b => b.outDate === t), stay = bs.find(b => b.inDate < t && b.outDate > t);
  if (inB && outB) return { cls: 'c-out', chip: 'Смена гостей', sub: short(outB.name) + ' → ' + short(inB.name) + (inB.inTime ? ' в ' + inB.inTime : ''), b: inB };
  if (inB) return { cls: 'c-in', chip: 'Заезд' + (inB.inTime ? ' ' + inB.inTime : ''), sub: inB.name, b: inB };
  if (outB) return { cls: 'c-out', chip: 'Выезд' + (outB.outTime ? ' ' + outB.outTime : ''), sub: outB.name, b: outB };
  if (stay) return { cls: 'c-busy', chip: 'Занят', sub: stay.name + ' · до ' + fd(stay.outDate), b: stay };
  const next = bs.filter(b => b.inDate > t).sort(byIn)[0];
  return { cls: 'c-free', chip: 'Свободен', sub: next ? 'Следующий заезд ' + fd(next.inDate) : 'Броней пока нет', b: null };
}

/* ===== Разбор фразы: бронь или дело ===== */
function parseText(raw, t, cabins) {

  const ORD = [[/^перв(ый|ая|ое|ого|ом|ому|ую|ой)$/, 1], [/^втор(ой|ая|ое|ого|ом|ому|ую)$/, 2], [/^трет(ий|ья|ье|ьего|ьем|ьему|ью|ьей)$/, 3], [/^четверт(ый|ая|ое|ого|ом|ому|ую|ой)$/, 4], [/^пят(ый|ая|ое|ого|ом|ому|ую|ой)$/, 5], [/^шест(ой|ая|ое|ого|ом|ому|ую)$/, 6], [/^седьм(ой|ая|ое|ого|ом|ому|ую)$/, 7], [/^восьм(ой|ая|ое|ого|ом|ому|ую)$/, 8], [/^девят(ый|ая|ое|ого|ом|ому|ую|ой)$/, 9], [/^десят(ый|ая|ое|ого|ом|ому|ую|ой)$/, 10], [/^одиннадцат/, 11], [/^двенадцат/, 12], [/^тринадцат/, 13], [/^четырнадцат/, 14], [/^пятнадцат/, 15], [/^шестнадцат/, 16], [/^семнадцат/, 17], [/^восемнадцат/, 18], [/^девятнадцат/, 19], [/^двадцат/, 20], [/^тридцат/, 30]];
  const wn = w => { if (UNITS[w] != null) return UNITS[w]; const o = ORD.find(x => x[0].test(w)); return o ? o[1] : null; };
  const toks = src.toLowerCase().replace(/[,;!?«»"()]/g, ' ').replace(/\s+/g, ' ').trim().split(' ');
  const out = [];
  for (let i = 0; i < toks.length; i++) {
    const w = toks[i].replace(/\.$/, '');
    let n = wn(w);
    if (n == null) { out.push(toks[i]); continue; }
    if ((n === 20 || n === 30) && i + 1 < toks.length) { const u = wn(toks[i + 1].replace(/\.$/, '')); if (u && u < 10) { n += u; i++; } }
    out.push(String(n));
  }
  const s = ' ' + out.join(' ') + ' ';

  /* --- даты --- */
  const MONS = ['январ', 'феврал', 'март', 'апрел', 'ма', 'июн', 'июл', 'август', 'сентябр', 'октябр', 'ноябр', 'декабр'];
  const M = '(январ[а-я]*|феврал[а-я]*|март[а-я]*|апрел[а-я]*|ма[йя]|июн[а-я]*|июл[а-я]*|август[а-я]*|сентябр[а-я]*|октябр[а-я]*|ноябр[а-я]*|декабр[а-я]*)';
  const mi = w => { if (!w) return null; if (/^ма[йя]/.test(w)) return 4; const i = MONS.findIndex(p => p !== 'ма' && w.indexOf(p) === 0); return i < 0 ? null : i; };
  const mn = x => (x && +x >= 1 && +x <= 12) ? +x - 1 : null;
  const DT = '(\\d{1,2})(?:[./](\\d{1,2}))?(?:-?(?:го|е|ое))?(?:\\s+числа)?(?:\\s+' + M + ')?';

    d1 = +r[1]; m1 = mn(r[2]) ?? mi(r[3]); d2 = +r[4]; m2 = mn(r[5]) ?? mi(r[6]);
  } else if ((r = s.match(new RegExp('\\s(\\d{1,2})\\s*[-–]\\s*(\\d{1,2})\\s+' + M)))) {

  };
  if (d1 && d2) {

    else if (/\sсегодня\s/.test(s)) inD = T0;
    else if ((r = s.match(new RegExp('\\s(\\d{1,2})(?:-?(?:го|е|ое))?\\s+' + M)))) inD = startOf(+r[1], mi(r[2]));
    else if ((r = s.match(/\s(\d{1,2})[./](\d{1,2})(?:[./]\d{2,4})?[\s.]/)) && mn(r[2]) != null) inD = startOf(+r[1], mn(r[2]));
    else if ((r = s.match(/\s(?:с|со)\s+(\d{1,2})(?:-?(?:го|е|ое))?(?:\s+числа)?\s/))) inD = startOf(+r[1], null);
    if (inD) {
      let n = null;
      if ((r = s.match(/\sна\s+(\d{1,2})\s*(?:ноч|сут|дн|ден)/)) || (r = s.match(/\s(\d{1,2})\s+(?:ноч|сут)/))) n = +r[1];
      else if (/\sна\s+неделю/.test(s)) n = 7;
      else if (/\sна\s+(?:ночь|сутки)/.test(s)) n = 1;
      else if (/\sна\s+выходные/.test(s)) n = 2;
      if (n) outD = plus(inD, n);
      else if ((r = s.match(new RegExp('\\s(?:по|до)\\s+(\\d{1,2})(?:-?(?:го|е|ое))?(?:\\s+числа)?(?:\\s+' + M + ')?[\\s.]')))) {
        const em = mi(r[2]) ?? inD.getMonth();

  /* --- домик --- */

  cabins.forEach(c => { const nm = String(c.name || '').toLowerCase().replace(/ё/g, 'е').trim(); if (nm.length > 2 && !/^домик\s*\d+$/.test(nm) && s.indexOf(' ' + nm) >= 0) cabin = c.id; });
  if (cabin == null) {

    const re1 = /\s(\d{1,2})(?:-?(?:й|ый|ой|ий|ом|ем))?\s+(?:домик|дом)/g; while ((m = re1.exec(s))) cands.push(+m[1]);

  (src.match(/\+?\d[\d\s\-()]{8,17}\d/g) || []).some(p => {
    let d = p.replace(/\D/g, '');
    if (d.length === 11 && d[0] === '8') d = '7' + d.slice(1);
    if (d.length === 10) d = '7' + d;
    if (d.length !== 11) return false;
    phone = '+' + d[0] + ' ' + d.slice(1, 4) + ' ' + d.slice(4, 7) + '-' + d.slice(7, 9) + '-' + d.slice(9);
    return true;
  });

  /* --- гости --- */
  let adults = null, kids = null;
  if ((r = s.match(/\s(\d{1,2})\s+взросл/))) adults = +r[1];
  if ((r = s.match(/\s(\d{1,2})\s+(?:реб|дет|малыш)/))) kids = +r[1]; else if (/\sс\s+(?:ребенком|малышом|дочкой|сыном)/.test(s)) kids = 1;
  if (adults == null && (r = s.match(/\s(\d{1,2})\s+(?:человек|чел|гост|персон)/))) adults = +r[1];
  if (adults == null) { const g = { вдвоем: 2, втроем: 3, вчетвером: 4, впятером: 5, вшестером: 6 }; Object.keys(g).forEach(k => { if (s.indexOf(' ' + k) >= 0) adults = g[k]; }); }

  /* --- деньги --- */
  const AMT = '(\\d{1,3}(?:\\s\\d{3})+|\\d+)\\s*(тыс[а-я]*\\.?|к(?![а-я]))?';
  const amt = m => m ? Math.round(+m[1].replace(/\s/g, '') * (m[2] ? 1000 : 1)) : 0;
  const perNight = amt(s.match(new RegExp('\\s' + AMT + '\\s*(?:р[а-я]*\\.?|₽)?\\s*(?:за|в)\\s+(?:ночь|сутки)')));
  const total = amt(s.match(new RegExp('(?:за все|итого|всего|стоимость|сумма)\\s*[:\\-]?\\s*' + AMT))) || amt(s.match(new RegExp('\\s' + AMT + '\\s*(?:р[а-я]*\\.?|₽)?\\s*(?:за все|итого|всего)')));
  const prepay = amt(s.match(new RegExp('(?:предоплат[а-я]*|аванс[а-я]*|задат[а-я]*|внес[а-я]*|заплатил[а-я]*|оплатил[а-я]*|перевел[а-я]*|скинул[а-я]*)\\s+(?:уже\\s+)?(?:в размере\\s+)?' + AMT)));
  const prepayFull = /оплатил[а-я]*\s+(?:все|полностью)|полностью\s+оплат/.test(s);
  const prepayMethod = /налич/.test(s) ? 'наличные' : /карт/.test(s) ? 'карта' : 'перевод';

  /* --- время --- */
  const findTime = str => {
    const re = /(?:в|к|около)\s+(\d{1,2})(?:[:.](\d{2}))?\s*(час[а-я]*|ч(?=[\s.])|утра|дня|вечера)?/g; let m;
    while ((m = re.exec(str))) {
      if (!m[2] && !m[3]) continue;
      let h = +m[1]; if ((m[3] === 'дня' || m[3] === 'вечера') && h < 12) h += 12;
      if (h <= 23) return P2(h) + ':' + (m[2] || '00');
    }
    return '';
  };
  const cut = s.search(/\s(?:выезд|выезжа|уезжа|уед)/);
  const outTime = cut >= 0 ? findTime(s.slice(cut)) : '';
  const inTime = findTime(cut >= 0 ? s.slice(0, cut) : s);

  /* --- имя --- */
  const STOP = ['домик', 'дом', 'доме', 'завтра', 'сегодня', 'послезавтра', 'семья', 'гости', 'гость', 'человек', 'с', 'со', 'по', 'в', 'во', 'на', 'до', 'и', 'к', 'нам', 'они', 'он', 'она', 'еще', 'уже', 'тоже', 'будет', 'будут', 'наверное', 'бронь', 'числа', 'взрослых', 'двое', 'трое', 'надо', 'нужно', 'дело', 'заезд', 'выезд', 'потом', 'вечером', 'утром', 'днем', 'ночью', 'там', 'тут', 'у', 'за', 'от', 'авито', 'суточно', 'домика', 'домики'];
  const okWord = w => { const l = w.toLowerCase(); return STOP.indexOf(l) < 0 && mi(l) == null && !/\d/.test(l) && l.length > 1; };
  const clean = x => x ? x.split(' ').filter(okWord).slice(0, 2).map(w => w[0].toUpperCase() + w.slice(1).toLowerCase()).join(' ') : '';
  const srcL = src ? src[0].toLowerCase() + src.slice(1) : '';
  const V = '(?:заезд|заезжа|заед|приезжа|приед|въезжа|въед|засел|бронир|забронир)';
  let name = '';
  const tries = [
    () => (srcL.match(new RegExp(V + '[а-я]*\\s+(?:к нам\\s+|семья\\s+|гост[а-я]*\\s+)?([А-Я][а-я]+(?:\\s+[А-Я][а-я]+)?)')) || [])[1],
    () => (src.match(new RegExp('(?:^|[\\s.])([А-Я][а-я]+(?:\\s+[А-Я][а-я]+)?)\\s+(?:' + V.slice(3, -1) + '|будет|будут|хочет)')) || [])[1],
    () => (srcL.match(/(?:на имя|для|клиент[а-я]*|гост[ья]|гостя)\s+([А-Я][а-я]+(?:\s+[А-Я][а-я]+)?)/) || [])[1],
    () => (s.match(new RegExp(V + '[а-я]*\\s+([а-я]{3,}(?:\\s+[а-я]{3,})?)')) || [])[1],
    () => { const m = src.match(/(?:^|\s)[А-Я][а-я]+(?:\s+[А-Я][а-я]+)?/g) || []; return m.map(x => clean(x.trim())).find(Boolean); }
  ];
  for (const f of tries) { name = clean(f()); if (name) break; }

  /* --- откуда, заметка --- */
  const source = /авито/.test(s) ? 'Авито' : /суточно/.test(s) ? 'Суточно' : /знаком|друз/.test(s) ? 'Знакомые' : /повторн|снова|опять|в прошлый раз/.test(s) ? 'Повторно' : /инст|вк\s|вконтакт|телеграм|соцсет/.test(s) ? 'Соцсети' : '';
  let note = '';
  if ((r = src.match(/(заметка|примечание|пожелани[а-я]*|просил[аи]?|просят|хотят)\s*[:\-–]?\s*(.+)$/i))) note = /^(заметка|примечание)/i.test(r[1]) ? r[2] : r[0];
  if (note) note = note[0].toUpperCase() + note.slice(1);

  /* --- дело --- */
  const low = s.trim();
  const isTask = /^(?:дело|задача|задание|надо|нужно|не забыть|напомни[а-я]*|важно|срочно|купить|починить|поменять|заменить|убрать|помыть|почистить|вызвать|проверить|отремонтировать|покрасить|заказать|привезти|отвезти|позвонить|вымыть|постирать|разобраться|прибрать|скосить|подкачать|докупить|отнести|забрать|сделать|повесить|прикрутить)/.test(low);
  const bookingWords = /заезж|заед|приезж|приед|въезж|въед|засел|бронь|бронир|гост|ноч|сутк/.test(s);
  let taskText = src.replace(/^(?:дело|задача|задание|не забыть|напомни(?:ть)?(?:\s+мне)?)\s*[:\-–,]?\s*/i, '').trim();
  if (taskText) taskText = taskText[0].toUpperCase() + taskText.slice(1);
  const important = /(?:^|\s)(?:важно|срочно)/.test(s);

  const kind = (isTask && !bookingWords) ? 'task' : inD ? 'booking' : (isTask || src.length > 3) ? 'task' : null;
  return {
    kind,
    booking: { name, phone, cabin, inDate: inD ? iso(inD) : '', outDate: outD ? iso(outD) : '', inTime, outTime, adults, kids, perNight, total, prepay, prepayFull, prepayMethod, source, note },
    task: { text: taskText, cabin: cabin == null ? 0 : cabin, important }
  };
}

/* ===== Финансы (общий модуль для приложения и бота) ===== */
const FIN = (() => {
  const P2 = n => String(n).padStart(2, '0');
  const pd = s => { const a = String(s).split('-').map(Number); return new Date(Date.UTC(a[0], a[1] - 1, a[2])); };
  const iso = d => d.toISOString().slice(0, 10);
  const add = (s, n) => { const d = pd(s); d.setUTCDate(d.getUTCDate() + n); return iso(d); };
  const nightsBetween = (a, b) => Math.round((pd(b) - pd(a)) / 864e5);
  const SOURCES = ['Авито', 'Суточно.ру', 'Сарафанное радио', 'Постоянный клиент', 'Соцсети', 'Другое'];
  const OLD = { 'Суточно': 'Суточно.ру', 'Знакомые': 'Сарафанное радио', 'Повторно': 'Постоянный клиент' };
  const normSource = s => OLD[s] || s || 'Не указано';
  const EXP_CATS = ['Коммуналка', 'Ремонт', 'Покупки', 'Реклама', 'Связь и интернет', 'Налоги', 'Другое'];
  const paidOf = b => (b.payments || []).reduce((s, p) => s + (+p.amount || 0), 0);
  const cab = (cfg, id) => ((cfg && cfg.cabins) || []).find(c => c.id == id) || {};

  /* «01.06-31.08, 31.12, 01.01-08.01» → [{from:'06-01', to:'08-31'}, …] */
  function parseRanges(text) {
    const out = [];
    String(text || '').split(/[,;\n]+/).forEach(part => {
      const m = part.match(/(\d{1,2})[.\/](\d{1,2})(?:\s*[-–—]\s*(\d{1,2})[.\/](\d{1,2}))?/);
      if (!m) return;
      const a = P2(+m[2]) + '-' + P2(+m[1]);
      const b = m[3] ? P2(+m[4]) + '-' + P2(+m[3]) : a;
      out.push({ from: a, to: b });
    });
    return out;
  }
  const inRanges = (md, rs) => rs.some(r => r.from <= r.to ? (md >= r.from && md <= r.to) : (md >= r.from || md <= r.to));

  /* Цена одной ночи (ночь начинается в дату date) */
  function nightPrice(cfg, cabinId, date) {
    const c = cab(cfg, cabinId), base = +c.price || 0, md = date.slice(5);
    const dow = pd(date).getUTCDay(), we = dow === 5 || dow === 6;
    if (inRanges(md, parseRanges(cfg && cfg.holidays))) return +c.holiday || +c.high || (we && +c.weekend) || base;
    if (inRanges(md, parseRanges(cfg && cfg.high))) return +c.high || (we && +c.weekend) || base;
    return (we && +c.weekend) || base;
  }
  function stayPrice(cfg, cabinId, inD, outD) {
    const list = [];
    for (let d = inD; d < outD && list.length < 400; d = add(d, 1)) list.push({ date: d, price: nightPrice(cfg, cabinId, d) });
    return { total: list.reduce((s, x) => s + x.price, 0), nights: list };
  }
  function commissionFor(cfg, source, total) {
    const p = ((cfg && cfg.platforms) || {})[normSource(source)] || {};
    return Math.round((+total || 0) * (+p.pct || 0) / 100 + (+p.fixed || 0));
  }
  const has = v => v !== undefined && v !== null && v !== '';
  function fin(b, cfg) {
    const kept = b.deposit && b.deposit.status === 'kept' ? (+b.deposit.kept || 0) : 0;
    const revenue = (+b.total || 0) + kept;
    const clean = has(b.cleanCost) ? +b.cleanCost : (+cab(cfg, b.cabin).cleaning || 0);
    const commission = has(b.commission) ? +b.commission : commissionFor(cfg, b.source, +b.total || 0);
    const p = paidOf(b);
    return { revenue, kept, clean, commission, net: revenue - clean - commission, paid: p, debt: Math.max(0, (+b.total || 0) - p), nights: nightsBetween(b.inDate, b.outDate) };
  }
  function monthRange(ym) {
    const a = ym.split('-').map(Number), last = new Date(Date.UTC(a[0], a[1], 0)).getUTCDate();
    return [ym + '-01', ym + '-' + P2(last)];
  }
  /* Отчёт за период: брони засчитываются по дате выезда, загрузка — по ночам внутри периода */
  function report(cfg, bookings, expenses, from, to) {
    const end = add(to, 1), days = nightsBetween(from, end);
    const blank = () => ({ revenue: 0, clean: 0, commission: 0, expenses: 0, net: 0, nights: 0, count: 0, kept: 0 });
    const tot = blank(), sources = {}, cats = {};
    const cabins = ((cfg && cfg.cabins) || []).map(c => Object.assign(blank(), { id: c.id, name: c.name, occNights: 0 }));
    const bs = (bookings || []).filter(b => b.outDate >= from && b.outDate <= to);
    bs.forEach(b => {
      const f = fin(b, cfg), c = cabins.find(x => x.id == b.cabin);
      [tot, c].forEach(o => { if (!o) return; o.revenue += f.revenue; o.clean += f.clean; o.commission += f.commission; o.nights += f.nights; o.count++; o.kept += f.kept; });
      const s = normSource(b.source), so = sources[s] || (sources[s] = { name: s, count: 0, revenue: 0, commission: 0, net: 0 });
      so.count++; so.revenue += f.revenue; so.commission += f.commission; so.net += f.revenue - f.commission - f.clean;
    });
    (bookings || []).forEach(b => {
      const c = cabins.find(x => x.id == b.cabin); if (!c) return;
      const a = b.inDate > from ? b.inDate : from, z = b.outDate < end ? b.outDate : end;
      c.occNights += Math.max(0, nightsBetween(a, z));
    });
    (expenses || []).filter(e => e.date >= from && e.date <= to).forEach(e => {
      const v = +e.amount || 0; tot.expenses += v;
      cats[e.category || 'Другое'] = (cats[e.category || 'Другое'] || 0) + v;
      const c = cabins.find(x => x.id == e.cabin); if (c) c.expenses += v;
    });
    cabins.forEach(c => { c.net = c.revenue - c.clean - c.commission - c.expenses; c.occ = days ? Math.min(1, c.occNights / days) : 0; c.adr = c.nights ? c.revenue / c.nights : 0; });
    tot.net = tot.revenue - tot.clean - tot.commission - tot.expenses;
    tot.occ = days && cabins.length ? Math.min(1, cabins.reduce((s, c) => s + c.occNights, 0) / (days * cabins.length)) : 0;
    tot.adr = tot.nights ? tot.revenue / tot.nights : 0;
    return { tot, cabins, sources: Object.values(sources).sort((a, b) => b.revenue - a.revenue), cats, bookings: bs, days };
  }
  /* Свободные окна: [{from, to}] — to = дата выезда */
  function freeWindows(bookings, cabinId, from, days) {
    const end = add(from, days), busy = (bookings || []).filter(b => b.cabin == cabinId && b.outDate > from && b.inDate < end).sort((a, b) => a.inDate < b.inDate ? -1 : 1);
    const out = []; let cur = from;
    busy.forEach(b => { if (b.inDate > cur) out.push({ from: cur, to: b.inDate }); if (b.outDate > cur) cur = b.outDate; });
    if (cur < end) out.push({ from: cur, to: end });
    return out.filter(w => nightsBetween(w.from, w.to) >= 1);
  }
  /* Домик ждёт уборки: последняя выехавшая бронь не отмечена как убранная */
  function needsCleaning(bookings, cabinId, today) {
    const last = (bookings || []).filter(b => b.cabin == cabinId && b.outDate <= today).sort((a, b) => a.outDate < b.outDate ? 1 : -1)[0];
    if (!last || (last.clean && last.clean.done)) return null;
    const stay = (bookings || []).find(b => b.cabin == cabinId && b.id !== last.id && b.inDate >= last.outDate && b.inDate < today);
    return stay ? null : last;
  }
  return { SOURCES, EXP_CATS, normSource, parseRanges, nightPrice, stayPrice, commissionFor, fin, monthRange, report, freeWindows, needsCleaning, add, nightsBetween };
})();

  return `
  <div class="calnav">

function guestGroups() {
  const map = new Map();
  for (const b of bookings) {
    const key = digits(b.phone) || 'n:' + String(b.name || '').trim().toLowerCase();
    if (!map.has(key)) map.set(key, { key, name: b.name, phone: b.phone, list: [] });
    const g = map.get(key); g.list.push(b);
    if (b.inDate >= g.list.reduce((m, x) => x.inDate > m ? x.inDate : m, '')) { g.name = b.name; g.phone = b.phone || g.phone; }
  }
  return [...map.values()].map(g => ({ ...g, last: g.list.reduce((m, x) => x.inDate > m ? x.inDate : m, ''), total: g.list.reduce((s, b) => s + paid(b), 0) }))
    .sort((a, b) => a.last < b.last ? 1 : -1);
}
function vGuests() {

function vMoney() { return (ui.mview || 'month') === 'year' ? vYear() : vMonth(); }
function vMonth() {
  const m = ui.month || today().slice(0, 7), [yy, mm] = m.split('-').map(Number), t = today();

  <div class="head" style="align-items:baseline"><h2>Должны</h2><b style="color:var(--warn)">${money(debts.reduce((s, b) => s + debt(b), 0))}</b></div>

/* --- Гости: отметки --- */
const gidOf = key => 'g' + (String(key).startsWith('n:') ? 'n' + Math.abs([...key].reduce((h, c) => ((h << 5) - h + c.charCodeAt(0)) | 0, 7)).toString(36) : String(key).replace(/\D/g, ''));
const gnoteFor = key => gnotes.find(x => x.key === key) || null;
function guestInfo(name, phone, exceptId) {
  const ph = digits(phone), nm = String(name || '').trim().toLowerCase();
  if (!ph && nm.length < 3) return null;
  const list = bookings.filter(b => b.id !== exceptId && ((ph && digits(b.phone) === ph) || (!ph && nm && String(b.name || '').trim().toLowerCase() === nm)));
  const key = ph || 'n:' + nm;
  const gn = gnoteFor(key) || (list[0] ? gnoteFor(digits(list[0].phone) || 'n:' + String(list[0].name || '').trim().toLowerCase()) : null);
  if (!list.length && !gn) return null;
  return { visits: list.length, mark: gn ? gn.mark : '', note: gn ? gn.note : '' };
}
function guestBanner(gi) {
  if (!gi) return '';
  if (gi.mark === 'bad') return `<div class="banner bad"><b>Внимание: проблемный гость.</b>${gi.note ? ' ' + esc(gi.note) : ''}${gi.visits ? ' Был у вас ' + gi.visits + ' раз.' : ''}</div>`;
  if (gi.mark === 'good') return `<div class="banner good"><b>Отличный гость</b>${gi.visits ? ', был у вас ' + gi.visits + ' раз — можно предложить скидку' : ''}.${gi.note ? ' ' + esc(gi.note) : ''}</div>`;
  return gi.visits ? `<div class="banner good">Постоянный гость: был у вас ${gi.visits} раз.${gi.note ? ' ' + esc(gi.note) : ''}</div>` : '';
}

const val = id => (document.getElementById(id) || {}).value || '';
function recalc() {
  if (!form) return;
  const inD = val('f_in'), outD = val('f_out'), n = inD && outD ? diff(inD, outD) : 0;
  const tot = document.getElementById('f_total'), hint = document.getElementById('f_nights');
  if (n <= 0) { hint.textContent = 'Выезд должен быть позже заезда'; return; }
  const sp = FIN.stayPrice(cfg, form.cabin, inD, outD);
  if (!form.totalTouched) {
    const v = form.fixedPN ? form.fixedPN * n : sp.total;
    tot.value = v || '';
  }
  const groups = {};
  sp.nights.forEach(x => { groups[x.price] = (groups[x.price] || 0) + 1; });
  const parts = Object.entries(groups).map(([p, c]) => (c > 1 ? c + ' × ' : '') + money(+p));
  hint.textContent = n + ' ' + nightsWord(n) + (sp.total ? ' · по ценам: ' + parts.join(' + ') + ' = ' + money(sp.total) : ' · цены за ночь можно задать в настройках');
  const total = +tot.value || 0;
  if (!form.commTouched) document.getElementById('f_comm').value = FIN.commissionFor(cfg, form.source, total) || '';
  if (!form.cleanTouched) document.getElementById('f_clean').value = +cabin(form.cabin).cleaning || '';
  const net = total - (+val('f_comm') || 0) - (+val('f_clean') || 0);
  document.getElementById('f_net').textContent = total ? 'Чистыми с брони: ' + money(net) : '';
}
function refreshGuestBanner() {
  const el = document.getElementById('f_gbanner'); if (!el || !form) return;
  const gi = guestInfo(val('f_name'), val('f_phone'), form.b.id);
  el.innerHTML = guestBanner(gi);
  if (gi && gi.visits && form.isNew && !form.source) {
    form.source = 'Постоянный клиент';
    document.querySelectorAll('#f_source button').forEach(x => x.classList.toggle('on', x.dataset.v === form.source));
    recalc();
  }
}
async function saveForm() {
  const err = document.getElementById('ferr');
  const showErr = t => { err.textContent = t; err.hidden = false; document.getElementById('panel').scrollTop = 0; haptic('error'); };
  const name = val('f_name').trim(), inD = val('f_in'), outD = val('f_out');
  if (!name) return showErr('Впишите имя гостя');
  if (!inD || !outD || diff(inD, outD) <= 0) return showErr('Выезд должен быть позже заезда');
  const clash = bookings.find(x => x.id !== form.b.id && x.cabin == form.cabin && x.inDate < outD && inD < x.outDate);
  if (clash) return showErr(`${cabin(form.cabin).name} уже занят: ${clash.name}, ${fd(clash.inDate)} – ${fd(clash.outDate)}`);
  const total = +val('f_total') || 0, n = diff(inD, outD), depAmt = +val('f_dep') || 0;
  const b = { ...form.b, name, phone: val('f_phone').trim(), cabin: form.cabin, inDate: inD, outDate: outD, inTime: val('f_intime'), outTime: val('f_outtime'),
    adults: +val('f_ad') || 0, kids: +val('f_kids') || 0, total, perNight: n ? Math.round(total / n) : 0, source: form.source || '', note: val('f_note').trim(),
    commission: val('f_comm') === '' ? 0 : +val('f_comm'), cleanCost: val('f_clean') === '' ? 0 : +val('f_clean') };
  b.deposit = depAmt > 0 ? Object.assign({ status: 'held' }, form.b.deposit || {}, { amount: depAmt }) : null;
  if (form.isNew) {
    b.created = today();
    const pre = +val('f_pre') || 0;
    if (pre > 0) b.payments = [{ id: uid(), amount: pre, method: document.querySelector('#f_pmethod .on').dataset.v, date: today(), note: 'предоплата' }];
  }
  await saveBooking(b); haptic(); toast(form.isNew ? 'Бронь сохранена' : 'Изменения сохранены');
  form = null;
  openCard(b.id);
}

async function copyText(text) {

}

  const ph = digits(g.phone), gn = gnoteFor(key) || {};
  openSheet(`
  <div><div class="sub">Гость</div><h1 style="font-size:24px">${esc(g.name)}</h1><div class="s">${esc(g.phone || 'телефон не указан')}</div></div>
  <div class="grid2"><div class="kv" style="background:#fff"><span>Визитов</span><b>${g.list.length}</b></div><div class="kv" style="background:#fff"><span>Заплатил всего</span><b>${money(g.total)}</b></div></div>
  <div class="card" style="gap:10px">
    <div class="t">Отметка о госте</div>
    <div class="seg" id="g_mark">${[['good', 'Отличный гость'], ['', 'Без отметки'], ['bad', 'Проблемный']].map(([v, n]) => `<button type="button" data-act="pick" data-v="${v}" class="${(gn.mark || '') === v ? 'on' : ''}">${n}</button>`).join('')}</div>
    <textarea id="g_note" rows="2" maxlength="200" placeholder="Заметка: шумели, разбили, просили скидку, очень аккуратные…" aria-label="Заметка о госте">${esc(gn.note || '')}</textarea>
    <button class="btn small" style="width:100%" data-act="gsave" data-key="${esc(key)}">Сохранить отметку</button>
    <div class="hint">Если гость с отметкой забронирует снова, приложение покажет предупреждение.</div>
  </div>
  ${ph ? `<div class="grid2"><a class="btn ghost" href="tel:+${ph}">${ICON.phone}Позвонить</a><button class="btn ghost" data-act="write" data-ph="${ph}">${ICON.send}Написать</button></div>` : ''}
  <h2>Брони</h2>
  <div class="list">${g.list.sort(byIn).reverse().map(b => `
    <button class="row" data-act="card" data-id="${b.id}"><div class="grow"><div class="t">${fd(b.inDate)} – ${fd(b.outDate)}</div><div class="s">${esc(cabin(b.cabin).name)} · ${money(b.total)}</div></div>
    ${debt(b) > 0 ? `<span class="chip c-out">долг ${money(debt(b))}</span>` : '<span class="chip c-free">оплачено</span>'}</button>`).join('')}</div>
  <button class="btn" data-act="newfor" data-key="${esc(key)}">${ICON.plus}Новая бронь для гостя</button>`);
}

/* --- Настройки --- */
function openSettings() {
  const pl = cfg.platforms || {};
  openSheet(`
  <h1 style="font-size:24px">Настройки</h1>
  <h2>Домики, цены и уборка</h2>
  <div class="hint">Будни — обычная цена за ночь. Выходные — ночи с пятницы на субботу и с субботы на воскресенье. Сезон и праздники — по датам ниже. Пустое поле — берётся обычная цена.</div>
  <div class="list" id="s_list">${cfg.cabins.map(c => `
    <div class="card" style="gap:8px;padding:14px">
      <input data-sid="${c.id}" data-k="name" value="${esc(c.name)}" maxlength="30" aria-label="Название домика" style="font-weight:700">
      <div class="grid2">
        ${[['price', 'Будни, ₽'], ['weekend', 'Выходные, ₽'], ['high', 'Сезон, ₽'], ['holiday', 'Праздники, ₽'], ['cleaning', 'Уборка, ₽']].map(([k, l]) => `
        <div class="field"><label for="s_${c.id}_${k}">${l}</label><input id="s_${c.id}_${k}" data-sid="${c.id}" data-k="${k}" type="number" inputmode="numeric" value="${c[k] || ''}"></div>`).join('')}
      </div>
    </div>`).join('')}</div>
  <button class="btn ghost" data-act="addcabin">${ICON.plus}Добавить домик</button>
  <h2>Сезон и праздники</h2>
  <div class="field"><label for="s_high">Высокий сезон (даты через запятую)</label><input id="s_high" value="${esc(cfg.high || '')}" placeholder="01.06-31.08"></div>
  <div class="field"><label for="s_hol">Праздники</label><input id="s_hol" value="${esc(cfg.holidays || '')}" placeholder="31.12, 01.01-08.01, 08.03, 01.05-03.05, 09.05"></div>
  <h2>Комиссии площадок</h2>
  <div class="hint">Процент от стоимости брони и/или фиксированная плата за бронь. Считается автоматически по полю «Откуда гость».</div>
  <div class="card" style="gap:10px" id="s_plat">${FIN.SOURCES.map(s => `
    <div style="display:grid;grid-template-columns:minmax(0,1fr) 84px 96px;gap:8px;align-items:center">
      <span class="t" style="font-size:14px">${s}</span>
      <input data-plat="${s}" data-k="pct" type="number" inputmode="decimal" value="${(pl[s] && pl[s].pct) || ''}" placeholder="%" aria-label="${s}: процент">
      <input data-plat="${s}" data-k="fixed" type="number" inputmode="numeric" value="${(pl[s] && pl[s].fixed) || ''}" placeholder="₽ за бронь" aria-label="${s}: рублей за бронь">
    </div>`).join('')}</div>
  <h2>Цель на месяц</h2>
  <div class="field"><label for="s_goal">Сколько хотите зарабатывать в месяц (доход), ₽</label><input id="s_goal" type="number" inputmode="numeric" value="${cfg.goal || ''}"></div>
  <h2>Шаблоны сообщений гостям</h2>
  <div class="hint">Подстановки: {имя} {домик} {заезд} {выезд} {время_заезда} {время_выезда} {ночей} {сумма} {оплачено} {долг} {залог}. Замените [ТЕКСТ В СКОБКАХ] на свой.</div>
  <div class="list" id="s_tpl">${tplList().map((x, i) => `
    <div class="card" style="gap:8px;padding:14px">
      <input data-tpl="${i}" data-k="name" value="${esc(x.name)}" maxlength="40" aria-label="Название шаблона" style="font-weight:700">
      <textarea data-tpl="${i}" data-k="text" rows="4" aria-label="Текст шаблона">${esc(x.text)}</textarea>
    </div>`).join('')}</div>
  <button class="btn" data-act="savesettings">Сохранить настройки</button>
  <div class="hint" style="text-align:center">${serverOK ? 'Всё сохраняется на сервере, бот присылает напоминания и отчёты.' : cloudOK ? 'Данные хранятся в вашем аккаунте Telegram и видны только вам — на любом вашем устройстве.' : 'Сейчас приложение открыто не в Telegram: данные сохраняются только в этом браузере.'}</div>`);
}
function readSettings() {
  document.querySelectorAll('#s_list [data-sid]').forEach(inp => {
    const c = cfg.cabins.find(x => x.id == inp.dataset.sid); if (!c) return;
    if (inp.dataset.k === 'name') c.name = inp.value.trim() || c.name; else c[inp.dataset.k] = +inp.value || 0;
  });
  const el = document.getElementById('s_high'); if (!el) return;
  cfg.high = el.value.trim(); cfg.holidays = val('s_hol').trim(); cfg.goal = +val('s_goal') || 0;
  const pl = {};
  document.querySelectorAll('#s_plat [data-plat]').forEach(inp => { const s = inp.dataset.plat; pl[s] = pl[s] || {}; pl[s][inp.dataset.k] = +String(inp.value).replace(',', '.') || 0; });
  cfg.platforms = pl;
  const tp = tplList().map(x => ({ ...x }));
  document.querySelectorAll('#s_tpl [data-tpl]').forEach(inp => { tp[+inp.dataset.tpl][inp.dataset.k] = inp.value; });
  cfg.templates = tp.filter(x => String(x.text).trim());
}

/* ===== Events ===== */
const onOf = sel => { const el = document.querySelector(sel + ' .on'); return el ? el.dataset.v : ''; };
const ACT = {
  parse: () => doParse(),
  mic: () => startMic(),
  qbooking: () => { const r = ui.parsed; ui.parsed = null; ui.qtext = ''; openForm(null, { draft: r.booking }); },
  qtask: async () => {
    const r = ui.parsed, x = r.task;
    await saveTask({ id: uid(), text: x.text || ui.qtext, cabin: +x.cabin || 0, important: !!x.important, done: false, created: today() });
    ui.parsed = null; ui.qtext = ''; haptic(); toast('Дело добавлено'); render(true);
  },
  addtask: async () => {
    const text = val('t_text').trim();
    if (!text) { toast('Напишите, что нужно сделать'); haptic('error'); return; }
    await saveTask({ id: uid(), text: text[0].toUpperCase() + text.slice(1), cabin: +onOf('#t_cabin') || 0, important: document.getElementById('t_imp').classList.contains('on'), done: false, created: today() });
    haptic(); toast('Дело добавлено'); render(true);
  },
  toggleimp: (d, el) => el.classList.toggle('on'),
  toggletask: async d => { const x = tasks.find(t => t.id === d.id); if (!x) return; await saveTask({ ...x, done: !x.done, doneDate: !x.done ? today() : '' }); haptic(); render(true); },
  deltask: async d => { if (await confirmBox('Удалить это дело?')) { await removeTask(d.id); render(true); } },
  tfilter: d => { ui.tf = d.v; render(true); },
  showdone: () => { ui.showDone = !ui.showDone; render(true); },
  tab: d => { ui.tab = d.tab; if (!document.getElementById('sheet').hidden) { document.getElementById('sheet').hidden = true; document.body.style.overflow = ''; if (tg && ver('6.1')) tg.BackButton.hide(); } render(); },
  close: () => { form = null; closeSheet(); },
  settings: () => openSettings(),
  new: d => openForm(null, { cabin: d.cabin, date: d.date }),
  card: d => openCard(d.id),
  guest: d => openGuest(d.key),
  newfor: d => { const g = guestGroups().find(x => x.key === d.key); openForm(null, g ? { name: g.name, phone: g.phone, source: 'Постоянный клиент' } : {}); },
  calmove: d => { ui.calStart = addDays(ui.calStart || today(), +d.n); render(); },
  caltoday: () => { ui.calStart = null; render(); },
  monthmove: d => { ui.month = ymShift(ui.month || today().slice(0, 7), +d.n); render(); },
  yearmove: d => { ui.year = (ui.year || +today().slice(0, 4)) + +d.n; render(); },
  mview: d => { ui.mview = d.v; render(); },
  openmonth: d => { ui.mview = 'month'; ui.month = d.m; render(); },
  fcabin: (d, el) => { form.cabin = +d.v; el.parentNode.querySelectorAll('button').forEach(x => x.classList.toggle('on', x === el)); recalc(); },
  fsource: (d, el) => { const on = !el.classList.contains('on'); el.parentNode.querySelectorAll('button').forEach(x => x.classList.remove('on')); el.classList.toggle('on', on); form.source = on ? d.v : ''; recalc(); },
  pick: (d, el) => el.parentNode.querySelectorAll('button').forEach(x => x.classList.toggle('on', x === el)),
  saveform: () => saveForm(),
  edit: d => openForm(bookings.find(x => x.id === d.id)),
  delbooking: async d => {
    const b = bookings.find(x => x.id === d.id);
    if (await confirmBox(`Удалить бронь «${b.name}» вместе с оплатами?`)) { await removeBooking(d.id); haptic(); toast('Бронь удалена'); closeSheet(); }
  },
  showpay: () => { document.getElementById('payform').style.display = 'flex'; document.getElementById('paybtn').style.display = 'none'; document.getElementById('p_amount').focus(); },
  savepay: async d => {
    const b = bookings.find(x => x.id === d.id); const amount = +val('p_amount');
    if (!(amount > 0)) { toast('Впишите сумму'); haptic('error'); return; }
    b.payments = (b.payments || []).concat({ id: uid(), amount, method: onOf('#p_method') || 'перевод', date: val('p_date') || today(), note: val('p_note').trim() });
    await saveBooking(b); haptic(); toast('Оплата записана'); openCard(b.id);
  },
  delpay: async d => {
    const b = bookings.find(x => x.id === d.id);
    if (await confirmBox('Удалить эту оплату?')) { b.payments = b.payments.filter(p => p.id !== d.pid); await saveBooking(b); openCard(b.id); }
  },
  write: d => { const url = 'https://t.me/+' + d.ph; if (tg && tg.openTelegramLink) tg.openTelegramLink(url); else window.open(url, '_blank'); },
  /* залог */
  depkeepshow: () => { document.getElementById('depform').style.display = 'flex'; document.getElementById('depbtns').style.display = 'none'; },
  depret: async d => { const b = bookings.find(x => x.id === d.id); b.deposit = { ...b.deposit, status: 'returned', kept: 0, date: today() }; await saveBooking(b); haptic(); toast('Залог возвращён'); openCard(b.id); },
  depkeep: async d => {
    const b = bookings.find(x => x.id === d.id), kept = Math.min(+val('dep_kept') || 0, +b.deposit.amount || 0);
    if (!(kept > 0)) { toast('Впишите сумму'); haptic('error'); return; }
    b.deposit = { ...b.deposit, status: 'kept', kept, reason: val('dep_reason').trim(), date: today() }; await saveBooking(b); haptic(); toast('Удержание записано'); openCard(b.id);
  },
  depreset: async d => { const b = bookings.find(x => x.id === d.id); b.deposit = { amount: b.deposit.amount, status: 'held' }; await saveBooking(b); openCard(b.id); },
  /* уборка */
  cleandone: async d => { const b = bookings.find(x => x.id === d.id); b.clean = { ...(b.clean || {}), done: true, by: val('cl_by').trim(), date: today() }; await saveBooking(b); haptic(); toast('Отмечено: убрано'); openCard(b.id); },
  cleanquick: async d => { const b = bookings.find(x => x.id === d.id); b.clean = { ...(b.clean || {}), done: true, date: today() }; await saveBooking(b); haptic(); toast(cabin(b.cabin).name + ': убрано'); render(true); },
  cleanpaid: async d => { const b = bookings.find(x => x.id === d.id); b.clean = { ...(b.clean || {}), paid: !(b.clean && b.clean.paid) }; await saveBooking(b); haptic(); openCard(b.id); },
  /* шаблоны */
  tpl: d => openTemplates(d.id),
  tplcopy: async d => { toast(await copyText(val('tpl_' + d.i)) ? 'Скопировано' : 'Не получилось скопировать'); haptic(); },
  tplwa: d => openLink('https://wa.me/' + d.ph + '?text=' + encodeURIComponent(val('tpl_' + d.i))),
  tpltg: async d => { await copyText(val('tpl_' + d.i)); toast('Текст скопирован — вставьте его в чат'); ACT.write(d); },
  /* свободные даты */
  freedates: () => openFreeDates(),
  fdays: d => openFreeDates(+d.v),
  fdcopy: async () => { toast(await copyText(val('fd_text')) ? 'Скопировано' : 'Не получилось скопировать'); haptic(); },
  /* расходы */
  newexp: () => openExpense(),
  editexp: d => openExpense(d.id),
  saveexp: async d => {
    const amount = +val('e_amount') || 0;
    if (!(amount > 0)) { toast('Впишите сумму'); haptic('error'); return; }
    await saveItem('expenses', { id: d.id, amount, date: val('e_date') || today(), category: onOf('#e_cat') || 'Другое', cabin: +onOf('#e_cab') || 0, note: val('e_note').trim() });
    haptic(); toast('Расход сохранён'); closeSheet();
  },
  delexp: async d => { if (await confirmBox('Удалить этот расход?')) { await removeItem('expenses', d.id); closeSheet(); } },
  /* отметки гостей */
  gsave: async d => {
    const mark = onOf('#g_mark'), note = val('g_note').trim(), id = gidOf(d.key);
    if (!mark && !note) await removeItem('gnotes', id); else await saveItem('gnotes', { id, key: d.key, mark, note });
    haptic(); toast('Сохранено'); openGuest(d.key);
  },
  /* настройки */
  addcabin: () => { readSettings(); const id = Math.max(0, ...cfg.cabins.map(c => c.id)) + 1; cfg.cabins.push({ id, name: 'Домик ' + id, price: 0 }); openSettings(); },
  savesettings: async () => { readSettings(); await saveCfg(); haptic(); toast('Сохранено'); closeSheet(); }
};
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]'); if (!el) return;
  const f = ACT[el.dataset.act]; if (!f) return;
  e.preventDefault(); f(el.dataset, el);
});
document.addEventListener('input', e => {
  const id = e.target.id;
  if (id === 'q') { ui.q = e.target.value; renderGuestList(); }
  if (id === 'qi') ui.qtext = e.target.value;
  if (!form) return;
  if (id === 'f_in' && val('f_out') <= val('f_in')) document.getElementById('f_out').value = addDays(val('f_in'), 1);
  if (id === 'f_total') form.totalTouched = true;
  if (id === 'f_comm') form.commTouched = true;
  if (id === 'f_clean') form.cleanTouched = true;
  if (['f_in', 'f_out', 'f_total', 'f_comm', 'f_clean'].includes(id)) recalc();
  if (id === 'f_name' || id === 'f_phone') refreshGuestBanner();
});

document.addEventListener('keydown', e => { if (e.target.id === 'qi' && e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); doParse(); } });

const START_TAB = QS.get('tab'), NB = QS.get('nb');
if (['today', 'cal', 'tasks', 'guests', 'money'].includes(START_TAB)) ui.tab = START_TAB;
load().then(() => {
  render();
  if (OPEN_B && bookings.some(b => b.id === OPEN_B)) openCard(OPEN_B);
  else if (NB) { try { openForm(null, { draft: JSON.parse(NB) }); } catch (e) {} }
});
</script>
</body>
</html>
